name: Marktplaats watch

on:
  schedule:
    # Elke 5 minuten — dit is de snelste interval die GitHub Actions
    # daadwerkelijk ondersteunt (alles sneller wordt genegeerd/overgeslagen).
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # handmatig starten via de Actions-tab
# trigger refresh
permissions:
  contents: write   # nodig om de state-bestanden terug te committen

concurrency:
  group: marktplaats-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installeer dependencies
        run: pip install requests

      - name: Draai watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/marktplaats_watch.py

      - name: Sla bijgewerkte state op
        run: |
          # Schrijft altijd een tijdstempel weg, zodat er elke run iets te
          # committen valt. Dat houdt de repository "actief", waardoor
          # GitHub de geplande workflow niet na 60 dagen stilzwijgend
          # uitschakelt wegens inactiviteit.
          date -u +"%Y-%m-%dT%H:%M:%SZ" > state/last_run.txt

          git config user.name "marktplaats-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen_ids.json state/last_run.txt
          git diff --staged --quiet || git commit -m "Update state [skip ci]"
          git push

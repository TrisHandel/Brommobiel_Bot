name: Marktplaats watch

on:
  schedule:
    # Elke 10 minuten. GitHub garandeert geen exacte timing (bij drukte kan
    # het een paar minuten uitlopen), maar dit is de instelling.
    - cron: "*/10 * * * *"
  workflow_dispatch:   # handmatig starten via de Actions-tab
    inputs:
      seed_only:
        description: "Alleen seed-run (state bijwerken zonder meldingen te versturen)"
        type: boolean
        default: false

permissions:
  contents: write   # nodig om state/seen_ids.json terug te committen

concurrency:
  group: marktplaats-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installeer dependencies
        run: pip install requests

      - name: Draai watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_HEARTBEAT_CHAT_ID: ${{ secrets.TELEGRAM_HEARTBEAT_CHAT_ID }}
          SEED_ONLY: ${{ github.event.inputs.seed_only }}
        run: python scripts/marktplaats_watch.py

      - name: Sla bijgewerkte state op
        run: |
          git config user.name "marktplaats-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen_ids.json
          git diff --staged --quiet && exit 0
          git commit -m "Update seen listings [skip ci]"
          # Probeer de push tot 3x, met een korte pauze ertussen, zodat een
          # kortstondige storing bij GitHub (bv. "Internal Server Error")
          # niet meteen de hele run laat falen.
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push mislukt (poging $i/3), even wachten en opnieuw proberen..."
            git pull --rebase
            sleep 5
          done
          echo "Push is na 3 pogingen nog steeds mislukt."
          exit 1
